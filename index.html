<style>
    /* ---------- GLOBAL ---------- */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #f5f5f5;
        background:
            radial-gradient(circle at top left, #1b4d4a 0%, transparent 35%),
            radial-gradient(circle at bottom right, #4b164c 0%, transparent 35%),
            #08090d;
        padding: 40px 20px;
    }

    /* ---------- MAIN CONTAINER ---------- */
    body > div {
        max-width: 1000px;
        margin: auto;
        padding: 35px !important;
        background: rgba(20, 20, 28, 0.75) !important;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 25px;
        box-shadow:
            0 25px 80px rgba(0, 0, 0, 0.55),
            inset 0 1px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
    }

    /* ---------- TITLE ---------- */
    h1 {
        background: linear-gradient(135deg, #00f5a0, #00d9f5) !important;
        color: #06110e !important;
        text-align: center;
        font-size: clamp(28px, 5vw, 48px);
        padding: 22px;
        margin-bottom: 35px;
        border-radius: 18px;
        letter-spacing: 1px;
        box-shadow: 0 10px 35px rgba(0, 245, 160, 0.2);
    }

    /* ---------- SONG TEXT ---------- */
    p {
        margin: 25px 0 10px;
        padding: 16px 20px;
        border-left: 4px solid #00f5a0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 18px;
        line-height: 1.6;
        transition: 0.3s ease;
    }

    p:hover {
        background: rgba(255, 255, 255, 0.09);
        transform: translateX(5px);
    }

    /* ---------- LINKS ---------- */
    a {
        display: inline-block;
        color: #00f5a0;
        font-weight: 700;
        text-decoration: none;
        transition: 0.25s ease;
    }

    a:hover {
        color: #00d9f5;
        text-shadow: 0 0 12px rgba(0, 245, 160, 0.6);
        transform: translateY(-2px);
    }

    /* ---------- ALBUM IMAGES ---------- */
    img {
        display: block;
        width: 260px;
        height: 260px;
        object-fit: cover;
        margin: 15px auto 35px;
        border-radius: 22px;
        border: 2px solid rgba(255, 255, 255, 0.12);

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.6),
            0 0 30px rgba(0, 245, 160, 0.08);

        transition:
            transform 0.35s ease,
            box-shadow 0.35s ease;
    }

    img:hover {
        transform: scale(1.05) translateY(-5px);
        box-shadow:
            0 25px 55px rgba(0, 0, 0, 0.7),
            0 0 35px rgba(0, 245, 160, 0.25);
    }

    /* ---------- NUMBERED SONG SECTIONS ---------- */
    p:has(+ p img) {
        margin-top: 30px;
    }

    /* ---------- MOBILE ---------- */
    @media (max-width: 600px) {

        body {
            padding: 15px;
        }

        body > div {
            padding: 20px !important;
            border-radius: 18px;
        }

        h1 {
            font-size: 28px;
            padding: 18px 10px;
        }

        p {
            font-size: 16px;
            padding: 13px;
        }

        img {
            width: 200px;
            height: 200px;
        }
    }

    /* ---------- ANIMATION ---------- */
    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    body > div {
        animation: fadeUp 0.8s ease forwards;
    }
</style>
